services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden
      POSTGRES_DB: warden
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U warden" ]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
